<!doctype html>
<html lang="sv">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#085F83">
<title>Feriejobbsguiden Alingsås</title>
<style>
/* Layout: en mobilkolumn, sticky toppbar med logga och rollväxlare, fast bottenmeny. Rollen styr accentfärgen: rosa för feriearbetare, grön för handledare, plommon för vårdnadshavare. Gula streckade rutor = uppgifter som EVU ska stämma av. Färger ur Alingsås kommuns palett. */
:root{
  --bg:#F3F7F8; --surface:#FFFFFF; --sunken:#EEF4F6; --ink:#3C3939; --muted:#655F60; --line:#E3E3E3;
  --blue:#085F83; --on-blue:#FFFFFF; --blue-soft:#C8E7EF;
  --pink:#E64285; --pink-text:#B8285F; --pink-soft:#FBEAEB;
  --green:#236151; --green-soft:#CADFDE; --plum:#812C56; --plum-soft:#E9D9EC; --cream:#F9F7D3;
  --hero:#085F83; --hero-ink:#FFFFFF; --hero-sub:#C8E7EF;
  --scrim:rgba(20,30,34,.45); --shadow:0 1px 2px rgba(60,57,57,.06),0 8px 24px -14px rgba(8,95,131,.25);
  --font:"Helvetica Neue", Helvetica, Arial, "Liberation Sans", Roboto, sans-serif;
}
@media (prefers-color-scheme: dark){ :root:not([data-theme="light"]){
  --bg:#0E1A1F; --surface:#15252C; --sunken:#112027; --ink:#F1F1F1; --muted:#A7B3B7; --line:#27383F;
  --blue:#C8E7EF; --on-blue:#085F83; --blue-soft:#143A4A;
  --pink:#E64285; --pink-text:#F5B0C9; --pink-soft:#3A1E2A;
  --green:#CADFDE; --green-soft:#1A3730; --plum:#E9D9EC; --plum-soft:#35202E; --cream:#2E2C1A;
  --scrim:rgba(0,0,0,.6); --shadow:0 1px 2px rgba(0,0,0,.3),0 10px 28px -14px rgba(0,0,0,.6); color-scheme:dark }}
:root[data-theme="dark"]{
  --bg:#0E1A1F; --surface:#15252C; --sunken:#112027; --ink:#F1F1F1; --muted:#A7B3B7; --line:#27383F;
  --blue:#C8E7EF; --on-blue:#085F83; --blue-soft:#143A4A;
  --pink:#E64285; --pink-text:#F5B0C9; --pink-soft:#3A1E2A;
  --green:#CADFDE; --green-soft:#1A3730; --plum:#E9D9EC; --plum-soft:#35202E; --cream:#2E2C1A;
  --scrim:rgba(0,0,0,.6); --shadow:0 1px 2px rgba(0,0,0,.3),0 10px 28px -14px rgba(0,0,0,.6); color-scheme:dark }
/* Rollaccent: bandet är alltid mörkt nog för vit text, soft/text följer temat */
.role-ung{ --role-band:#E64285; --role-soft:var(--pink-soft); --role-text:var(--pink-text) }
.role-hand{ --role-band:#236151; --role-soft:var(--green-soft); --role-text:var(--green) }
.role-vuxen{ --role-band:#812C56; --role-soft:var(--plum-soft); --role-text:var(--plum) }
.verify{background:var(--cream);border:1.5px dashed #C9A800;color:var(--ink);border-radius:12px}
html,body{height:100%}
body{background:var(--bg);color:var(--ink);font-family:var(--font);font-size:16px;line-height:1.45;-webkit-tap-highlight-color:transparent}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:40;background:var(--surface)}
.gutter{padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
h1,h2,h3{text-wrap:balance}
.tnum{font-variant-numeric:tabular-nums}
.eyebrow{font-size:12px;text-transform:uppercase;letter-spacing:.08em;font-weight:700;color:var(--muted)}
.card{background:var(--surface);border:1px solid var(--line);border-radius:16px;box-shadow:var(--shadow)}
.logo-d{display:none}
@media (prefers-color-scheme: dark){ :root:not([data-theme="light"]) .logo-l{display:none} :root:not([data-theme="light"]) .logo-d{display:block} }
:root[data-theme="dark"] .logo-l{display:none} :root[data-theme="dark"] .logo-d{display:block}
:root[data-theme="light"] .logo-l{display:block} :root[data-theme="light"] .logo-d{display:none}
button,a{outline:none}
button:focus-visible,a:focus-visible{box-shadow:0 0 0 3px var(--surface),0 0 0 5px var(--blue)}
.sheet-in{animation:sheet .28s cubic-bezier(.2,.8,.2,1)}
.fade-in{animation:fade .2s ease-out}
.pop{animation:pop .35s cubic-bezier(.2,1.6,.4,1)}
@keyframes sheet{from{transform:translateY(24px);opacity:.4}to{transform:none;opacity:1}}
@keyframes fade{from{opacity:0}to{opacity:1}}
@keyframes pop{from{transform:scale(.6)}to{transform:none}}
@media (prefers-reduced-motion: reduce){.sheet-in,.fade-in,.pop{animation:none}}
</style>

tailwind.config = { theme: { extend: {

    blue:'var(--blue)', onblue:'var(--on-blue)', bluesoft:'var(--blue-soft)', pink:'var(--pink)', pinktext:'var(--pink-text)', pinksoft:'var(--pink-soft)',
    green:'var(--green)', greensoft:'var(--green-soft)', plum:'var(--plum)', plumsoft:'var(--plum-soft)', cream:'var(--cream)',
    hero:'var(--hero)', heroink:'var(--hero-ink)', herosub:'var(--hero-sub)',
    roleband:'var(--role-band)', rolesoft:'var(--role-soft)', roletext:'var(--role-text)' } } } };
</script>

          <div className="flex items-start justify-between gap-3">
            <div><h2 id=${'h-'+g.id} className=${'font-bold text-xl leading-tight '+(all?'text-green':'')}>${all ? g.done : g.title}</h2><p className="text-sm text-muted">${g.sub}</p></div>
            <span className=${'shrink-0 text-sm font-bold rounded-full px-2.5 py-1 tnum '+(all?'bg-surface text-green':'bg-rolesoft text-roletext')}>${done} av ${g.items.length}</span>
          </div>
          <${Progress} value=${done} max=${g.items.length} done=${all}/>
        </div>
        <ul className="border-t border-line divide-y divide-[var(--line)]">
          ${g.items.map(c=>{ const on = !!checks[c.id], isOpen = open===c.id;
            return html`<li key=${c.id}>
              <div className="flex items-center gap-3 px-4 py-3">
                <button id=${'chk-'+c.id} role="checkbox" aria-checked=${on} aria-label=${c.t} onClick=${()=>setChecks(s=>({...s,[c.id]:!on}))}
                  className=${'w-8 h-8 shrink-0 rounded-[10px] border-2 flex items-center justify-center transition '+(on?'bg-green border-[var(--green)] text-surface':'border-line bg-surface')}>
                  ${on && html`<span className="pop flex"><${Icon} name="check" size=${18}/></span>`}
                </button>
                <button onClick=${()=>setOpen(isOpen?null:c.id)} aria-expanded=${isOpen} className="flex-1 min-w-0 flex items-center gap-2 text-left">
                  <span className="flex-1 min-w-0">
                    <span className=${'block font-bold leading-snug '+(on?'text-muted line-through decoration-2':'')}>${c.t}</span>
                    ${c.note && html`<span className="block text-sm text-muted">${c.note}</span>`}
                    ${c.verify && html`<span className="inline-flex items-center gap-1 text-xs font-bold mt-0.5"><span className="w-2 h-2 rounded-full" style=${{background:'#FAD945',boxShadow:'0 0 0 1.5px #C9A800'}}></span>Stäm av</span>`}
                  </span>
                  <${Icon} name="chevD" size=${18} className=${'text-muted shrink-0 transition '+(isOpen?'rotate-180':'')}/>
                </button>
              </div>
              ${isOpen && html`<div className="px-4 pb-4 pl-[60px] flex flex-col gap-2 text-[15px] fade-in">
                <ul className="flex flex-col gap-1.5">${c.how.map((h,i)=>html`<li key=${i} className="flex gap-2"><span className="mt-2 w-1.5 h-1.5 rounded-full bg-roleband shrink-0"></span><span>${h}</span></li>`)}</ul>
                <div className="flex flex-wrap gap-3 items-center">
                  ${c.link && html`<a href=${c.link.href} target="_blank" rel="noopener" className="font-bold text-blue inline-flex items-center gap-1 underline underline-offset-2">${c.link.text}<${Icon} name="ext" size=${14}/></a>`}
                  ${c.video && html`<button onClick=${()=>openFilm(c.video)} className="font-bold text-blue inline-flex items-center gap-1"><${Icon} name="playSolid" size=${14}/> Se filmen${watched[c.video]?' (sedd)':''}</button>`}
                </div>
                ${c.verify && html`<${Verify} text=${c.verify}/>`}
                ${c.mina && html`<${MatchaButton} compact=${true} label=${role==='hand'?'Logga in i MatchaNU':'Logga in på Mina sidor'}/>`}
                ${c.privacy && html`<button onClick=${openPrivacy} className="self-start font-bold text-blue inline-flex items-center gap-1"><${Icon} name="lock" size=${14}/> Läs informationen</button>`}
              </div>`}
            </li>`; })}
        </ul>
      </section>`; })}
    <button onClick=${()=>{ setChecks({}); toast('Checklistan är nollställd'); }} className="self-center text-xs text-muted underline underline-offset-2">Nollställ checklistan</button>
  </div>`;
}

/* ---------- Filmer ---------- */
function Films({ role, watched, openFilm }){
  const films = VIDEOS.filter(v=>v.who===role || (role==='vuxen' && v.forVuxen));
  const seen = films.filter(v=>watched[v.id]).length;
  return html`<div className="flex flex-col gap-5">
    <header className="flex flex-col gap-1">
      <div className="eyebrow">Filmer · ${ROLES[role].label.toLowerCase()}</div>
      <h1 className="font-extrabold text-[28px] leading-tight tracking-tight">${{ung:'Titta, lyssna, lär', hand:'Filmer för handledare', vuxen:'Bra att se tillsammans'}[role]}</h1>
      <p className="text-muted">${{ung:'Korta filmer om det viktigaste.', hand:'Repetera det vi gick igenom på utbildningen.', vuxen:'En film för dig, och några av dem som feriearbetaren ser.'}[role]} ${seen} av ${films.length} sedda.</p>
      <div className="mt-2"><${Progress} value=${seen} max=${films.length} done=${seen===films.length}/></div>
    </header>
    <div className="grid grid-cols-1 min-[400px]:grid-cols-2 gap-4">
      ${films.map(v=>html`<button key=${v.id} onClick=${()=>openFilm(v.id)} className=${'card overflow-hidden text-left flex flex-col '+(v.start?'min-[400px]:col-span-2':'')}>
        <div className="relative aspect-video max-w-full">
          <${Thumb} art=${v.art}/>
          <span className="absolute inset-0 flex items-center justify-center"><span className="w-11 h-11 rounded-full flex items-center justify-center text-white" style=${{background:'rgba(20,30,34,.6)'}}><${Icon} name="playSolid" size=${20}/></span></span>
          <span className="absolute bottom-2 right-2 text-[11px] font-bold text-white rounded-md px-1.5 py-0.5 tnum" style=${{background:'rgba(20,30,34,.7)'}}>${v.length}</span>
          ${v.start && v.who===role && html`<span className="absolute top-2 left-2 text-[11px] font-bold text-white rounded-md px-2 py-0.5 bg-roleband">Börja här</span>`}
        </div>
        <div className="p-3 flex flex-col gap-2 flex-1">
          <span className="font-bold leading-snug">${v.title}</span>
          <span className=${'mt-auto self-start text-xs font-bold rounded-full px-2 py-0.5 flex items-center gap-1 '+(watched[v.id]?'bg-greensoft text-green':'bg-sunken text-muted border border-line')}>
            ${watched[v.id] ? html`<${Icon} name="check" size=${14}/> Sedd` : 'Ej sedd'}
          </span>
        </div>
      </button>`)}
    </div>
  </div>`;
}

/* ---------- Spelare ---------- */
function Player({ video, role, watched, onClose, onWatched }){
  const [playing, setPlaying] = useState(false);
  const [progress, setProgress] = useState(watched ? 1 : 0);
  const [total] = useState(()=>{ const [m,s] = video.length.split(':').map(Number); return m*60+s; });
  useEffect(()=>{ if(!playing) return; const t = setInterval(()=>setProgress(p=>Math.min(1, p + 1/60)), 100); return ()=>clearInterval(t); },[playing]);
  useEffect(()=>{ if(playing && progress>=1){ setPlaying(false); onWatched(true); } },[progress, playing]);
  const cur = Math.round(progress*total);
  const fmt = s => `${Math.floor(s/60)}:${pad(s%60)}`;
  return html`<${Sheet} label=${video.title} onClose=${onClose}>
    <div className="flex flex-col gap-4">
      <div className="relative rounded-2xl overflow-hidden aspect-video max-w-full" style=${{background:'#0B1F27'}}>
        <div className=${'absolute inset-0 transition-opacity '+(playing?'opacity-60':'opacity-100')}><${Thumb} art=${video.art}/></div>
        <button onClick=${()=>{ if(progress>=1) setProgress(0); setPlaying(p=>!p); }} className="absolute inset-0 flex items-center justify-center" aria-label=${playing?'Pausa':'Spela upp'}>
          <span className="w-16 h-16 rounded-full flex items-center justify-center text-white" style=${{background:'rgba(20,30,34,.65)'}}>
            ${playing ? html`<svg width="26" height="26" viewBox="0 0 24 24" aria-hidden="true"><rect x="6" y="5" width="4" height="14" rx="1" fill="currentColor"/><rect x="14" y="5" width="4" height="14" rx="1" fill="currentColor"/></svg>` : html`<${Icon} name="playSolid" size=${28}/>`}
          </span>
        </button>
        <div className="absolute bottom-0 inset-x-0 px-3 pb-2 pt-6 flex items-center gap-3 text-white text-xs font-bold tnum" style=${{background:'linear-gradient(transparent,rgba(20,30,34,.75))'}}>
          <span>${fmt(cur)}</span>
          <div className="flex-1 h-1.5 rounded-full" style=${{background:'rgba(255,255,255,.3)'}}><div className="h-full rounded-full" style=${{width:progress*100+'%',background:'var(--role-band)'}}></div></div>
          <span>${video.length}</span>
        </div>
      </div>
      <div className="flex items-start justify-between gap-3">
        <div>${video.start && html`<div className="text-xs font-bold text-roletext mb-1">Börja här</div>`}<h2 className="font-bold text-xl leading-tight">${video.title}</h2></div>
        <button onClick=${onClose} className="p-2 -m-1 rounded-xl text-muted shrink-0" aria-label="Stäng"><${Icon} name="x"/></button>
      </div>
      <p>${video.lead}</p>
      <div className="flex flex-col gap-2">
        <div className="eyebrow">I filmen</div>
        <ul className="flex flex-col gap-2">${video.points.map((p,i)=>html`<li key=${i} className="flex gap-2"><span className="mt-2 w-2 h-2 rounded-full bg-roleband shrink-0"></span><span>${p}</span></li>`)}</ul>
      </div>
      ${video.mina && html`<${MatchaButton} compact=${true} label=${video.who==='ung'?'Logga in på Mina sidor':'Logga in i MatchaNU'}/>`}
      <p className="text-xs text-muted">Demo: filmen spelas upp förkortat på sex sekunder.</p>
      <button onClick=${()=>onWatched(!watched)} className=${'h-12 rounded-2xl font-bold flex items-center justify-center gap-2 '+(watched?'bg-greensoft text-green':'border border-line')}>
        ${watched ? html`<${Icon} name="check" size=${18}/> Sedd · ångra` : 'Markera som sedd'}
      </button>
    </div>
  <//>`;
}

/* ---------- App ---------- */
function App(){
  const [role, setRole] = useState(()=>{ const h = (location.hash||'').slice(1); return ROLES[h] ? h : store.get('role', null); });
  const [tab, setTab] = useState('start');
  const [checks, setChecks] = useState(()=>store.get('checks2', { ung:{ avtal:true, konto:true }, hand:{ hutb:true } }));
  const [watched, setWatched] = useState(()=>store.get('watched', {}));
  const [film, setFilm] = useState(null);
  const [privacy, setPrivacy] = useState(false);
  const [toastMsg, setToastMsg] = useState(null);
  const toastTimer = useRef();
  const toast = msg => { setToastMsg(msg); clearTimeout(toastTimer.current); toastTimer.current = setTimeout(()=>setToastMsg(null), 2400); };
  useEffect(()=>store.set('role',role),[role]);
  useEffect(()=>store.set('checks2',checks),[checks]);
  useEffect(()=>store.set('watched',watched),[watched]);
  useEffect(()=>{ window.scrollTo(0,0); },[tab, role]);
  useEffect(()=>{ if(watched.intro && !(checks.ung||{}).film) setChecks(c=>({...c, ung:{...(c.ung||{}), film:true}})); },[watched.intro]);

  if(!role) return html`<${RolePicker} onPick=${r=>{ setRole(r); setTab('start'); }}/>`;

  const R = ROLES[role];
  const roleChecks = checks[role] || {};
  const setRoleChecks = fn => setChecks(c=>({...c, [role]: typeof fn==='function' ? fn(c[role]||{}) : fn}));
  const openFilm = id => setFilm(VIDEOS.find(v=>v.id===id));
  const other = OTHER[role];
  const swap = () => { setRole(other); setTab('start'); toast('Du ser nu vyn för '+ROLES[other].label.toLowerCase()); };
  const home = () => { setFilm(null); setPrivacy(false); setRole(null); };
  const NAV = [['start','Start','home'],['checklist','Checklista','list'],['films','Filmer','film']];

  return html`<div className=${'min-h-full role-'+role}>
    <header className="sticky z-30 bg-surface border-b border-line gutter" style=${{top:'env(safe-area-inset-top,0px)'}}>
      <div className="max-w-[440px] mx-auto h-14 flex items-center gap-3">
        <button onClick=${home} id="home" className="rounded-lg -m-1 p-1" aria-label="Till startsidan: välj om du är feriearbetare, handledare eller vårdnadshavare"><${KommunLogo} height=${30}/></button>
        <div className="flex-1"></div>
        <button onClick=${home} id="role-switch" className="flex items-center gap-2 rounded-full pl-1 pr-3 py-1 bg-rolesoft text-roletext text-sm font-bold" aria-label=${'Visar '+R.label.toLowerCase()+'. Byt roll'}>
          <span className="w-7 h-7 rounded-full bg-roleband text-white flex items-center justify-center"><${Icon} name=${R.icon} size=${16}/></span>
          ${R.label}<${Icon} name="swap" size=${16}/>
        </button>
      </div>
      <div className="max-w-[440px] mx-auto h-1 bg-roleband rounded-full -mb-px"></div>
    </header>
    <main className="gutter" style=${{paddingTop:'20px', paddingBottom:'calc(104px + env(safe-area-inset-bottom,0px))'}}>
      <div className="max-w-[440px] mx-auto flex flex-col gap-6">
        ${tab==='start' && html`<${Start} role=${role} checks=${roleChecks} watched=${watched} go=${setTab} openFilm=${openFilm} openPrivacy=${()=>setPrivacy(true)} toast=${toast}/>`}
        ${tab==='checklist' && html`<${Checklist} role=${role} checks=${roleChecks} setChecks=${setRoleChecks} watched=${watched} openFilm=${openFilm} openPrivacy=${()=>setPrivacy(true)} toast=${toast}/>`}
        ${tab==='films' && html`<${Films} role=${role} watched=${watched} openFilm=${openFilm}/>`}
        <button onClick=${swap} className="card p-4 flex items-center gap-3 text-left">
          <span className=${'role-'+other+' w-10 h-10 rounded-xl bg-roleband text-white flex items-center justify-center shrink-0'}><${Icon} name=${ROLES[other].icon} size=${20}/></span>
          <span className="flex-1 min-w-0"><span className="block font-bold">${{ung:'Vad får din handledare veta?', hand:'Vad får feriearbetaren veta?', vuxen:'Vad får ditt barn veta?'}[role]}</span><span className="block text-sm text-muted">Se guiden för ${ROLES[other].label.toLowerCase()}</span></span>
          <${Icon} name="swap" size=${18} className="text-muted shrink-0"/>
        </button>
        <button onClick=${()=>setPrivacy(true)} className="self-center text-sm font-bold text-blue underline underline-offset-2">Så behandlar vi personuppgifter</button>
        <p className="text-xs text-muted text-center">Prototyp. Ingen inloggning och inga personuppgifter. Filmerna är exempel.</p>
        <div className="flex justify-end pt-1"><${KommunLogo} height=${34}/></div>
      </div>
    </main>
    <nav className="fixed bottom-0 inset-x-0 z-40 bg-surface border-t border-line gutter" style=${{paddingBottom:'env(safe-area-inset-bottom,0px)'}} aria-label="Huvudmeny">
      <div className="max-w-[440px] mx-auto grid grid-cols-3">
        ${NAV.map(([k,label,icon])=>{ const on = tab===k;
          return html`<button key=${k} onClick=${()=>setTab(k)} aria-current=${on?'page':undefined} className=${'h-[68px] flex flex-col items-center justify-center gap-1 text-xs font-bold '+(on?'text-roletext':'text-muted')}>
            <span className=${'px-5 py-1 rounded-full transition '+(on?'bg-rolesoft':'')}><${Icon} name=${icon} size=${22}/></span>${label}
          </button>`; })}
      </div>
    </nav>
    ${film && html`<${Player} key=${film.id} video=${film} role=${role} watched=${!!watched[film.id]} onClose=${()=>setFilm(null)} onWatched=${val=>setWatched(w=>({...w,[film.id]:val}))}/>`}
    ${privacy && html`<${PrivacySheet} onClose=${()=>setPrivacy(false)}/>`}
    <${Toast} toast=${toastMsg}/>
  </div>`;
}

ReactDOM.createRoot(document.getElementById('root')).render(html`<${App}/>`);
</script>

</body>
</html>
